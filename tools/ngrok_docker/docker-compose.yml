services:
  php:
    image: php:8.4-fpm
    volumes:
      - ./php:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  ngrok:
    image: ngrok/ngrok:latest
    command: http nginx:80
    environment:
      NGROK_AUTHTOKEN: <your_token_here_see_README.md>
    ports:
      - "4040:4040"
    depends_on:
      - nginx